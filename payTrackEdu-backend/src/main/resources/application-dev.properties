# ===== Development profile =====
# Backend runs on 8081 (8080 is taken by Apache httpd on the dev machine).
server.port=8081

# Verbose SQL + logging for local debugging
spring.jpa.show-sql=true
logging.level.com.payTrackEdu.application=DEBUG
logging.level.org.springframework.mail=DEBUG




# Allow the Angular dev server
app.cors.allowed-origins=https://brachydactylic-reena-systemic.ngrok-free.dev,http://localhost:4200
